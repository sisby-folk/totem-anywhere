//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyAccessibility
plugins {
	id "maven-publish"
	alias libs.plugins.loom
	alias libs.plugins.githubRelease
	alias libs.plugins.minotaur
}

version = "$baseVersion+$branch"
archivesBaseName = project.archivesName

dependencies {
	minecraft libs.mc
	mappings variantOf(libs.yarn) { classifier "v2" }
	modImplementation libs.fl
}

processResources {
	final Map<String, String> meta = [
		version        : version,
		modId          : modId,
		modName        : modName,
		modDescription : modDescription,
		homepage       : homepage,
		issues         : issues,
		sources        : sources,
		license        : license,
		authors        : authors.split(", ").join("\",\n    \""),
		members        : "${authors}",
		mc             : libs.versions.mc.get(),
		fl             : libs.versions.fl.get()
	]
	inputs.properties(meta)
	filesMatching("*.mod.json") { expand(meta) }
	filesMatching("META-INF/*mods.toml") { expand(meta) }
}


tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 8
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	from("LICENSE") {
		rename { "${it}_${archivesBaseName}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}

if (System.getenv("MODRINTH_TOKEN")) {
	apply plugin: "com.modrinth.minotaur"
	modrinth {
		token = System.getenv("MODRINTH_TOKEN")
		projectId = 'totem-anywhere'
		versionNumber = project.version
		versionName = baseVersion
		versionType = 'release'
		uploadFile = remapJar
		gameVersions = ['1.17', '1.17.1', '1.18', '1.18.1', '1.18.2', '1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4', '1.20', '1.20.1']
		loaders = ['quilt', 'fabric', 'forge']
		detectLoaders = false
		dependencies {
		}
		changelog = "Changelog: https://github.com/sisby-folk/totem-anywhere/releases/tag/v" + baseVersion
		syncBodyFrom = rootProject.file("README.md").text
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = project.name
	versionNumber = project.version
	uploadFile = remapJar
	gameVersions = compatibleVersions.split(", ").toList()
	loaders = compatibleLoaders.split(", ").toList()
	dependencies {
	}
	changelog = !file("CHANGELOG.md").exists() ? "" : rootProject.file("CHANGELOG.md").text + "\n\nChangelog: https://github.com/sisby-folk/$project.name/releases/tag/v$version"
	syncBodyFrom = rootProject.file("README.md").text
}

githubRelease {
	token System.getenv("GITHUB_TOKEN")
	owner "sisby-folk"
	repo project.name
	tagName "v" + version
	releaseName version
	targetCommitish branch
	releaseAssets remapJar
	generateReleaseNotes true
	body !file("CHANGELOG.md").exists() ? "" : rootProject.file("CHANGELOG.md").text
}

tasks.register("fullRelease") {
	group "publishing"
	dependsOn "githubRelease"
	dependsOn "modrinth"
}
